<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Sección de residencias con tres tarjetas de propiedades, mockup sintético">
  <title>Residencias — Mirador Azul — mockup sintético</title>
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="24" flood-color="#1B2A33" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="imgSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8E4EA"/>
      <stop offset="0.55" stop-color="#A7BEC9"/>
      <stop offset="0.56" stop-color="#7E9CAE"/>
      <stop offset="1" stop-color="#5E8093"/>
    </linearGradient>
    <linearGradient id="imgSand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE7D8"/>
      <stop offset="1" stop-color="#CDBB98"/>
    </linearGradient>
    <linearGradient id="imgPine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DDE5DC"/>
      <stop offset="1" stop-color="#93A795"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="#F4F6F7"/>

  <!-- Section header -->
  <text x="640" y="104" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="4" fill="#9A7A38">TIPOLOGÍAS RESIDENCIALES</text>
  <text x="640" y="160" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#111827">Residencias frente al mar</text>
  <text x="640" y="196" text-anchor="middle" font-size="15" fill="#5A666E">Tres tipologías exclusivas, doce unidades en total. Datos de ejemplo con fines demostrativos.</text>

  <!-- Card 1: Villa Almadrava -->
  <g filter="url(#cardShadow)">
    <rect x="60" y="240" width="360" height="430" rx="12" fill="#FFFFFF"/>
  </g>
  <path d="M60 252 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v178 h-360 Z" fill="url(#imgSea)"/>
  <circle cx="356" cy="292" r="26" fill="#C5A059" opacity="0.85"/>
  <g stroke="#F2EDE2" stroke-width="2" fill="none">
    <rect x="92" y="360" width="90" height="30"/>
    <line x1="92" y1="375" x2="182" y2="375"/>
    <line x1="84" y1="390" x2="190" y2="390"/>
  </g>
  <text x="88" y="478" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#111827">Villa Almadrava</text>
  <text x="88" y="506" font-size="14" fill="#5A666E">380 m² · 4 Dormitorios · Piscina infinita</text>
  <rect x="88" y="526" width="48" height="2" fill="#C5A059"/>
  <text x="88" y="560" font-size="16" font-weight="600" fill="#9A7A38">Desde 1.450.000 €</text>
  <text x="88" y="628" font-size="13" font-weight="600" fill="#3A4753">Ver residencia →</text>

  <!-- Card 2: Ático Levante -->
  <g filter="url(#cardShadow)">
    <rect x="460" y="240" width="360" height="430" rx="12" fill="#FFFFFF"/>
  </g>
  <path d="M460 252 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v178 h-360 Z" fill="url(#imgSand)"/>
  <path d="M460 372 Q 550 336 640 372 T 820 372 L820 430 L460 430 Z" fill="#BCA87F" opacity="0.55"/>
  <circle cx="512" cy="300" r="22" fill="#C5A059" opacity="0.7"/>
  <g stroke="#8A7A55" stroke-width="2" fill="none" opacity="0.8">
    <rect x="640" y="330" width="104" height="34"/>
    <line x1="640" y1="347" x2="744" y2="347"/>
  </g>
  <text x="488" y="478" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#111827">Ático Levante</text>
  <text x="488" y="506" font-size="14" fill="#5A666E">145 m² · 2 Dormitorios · Terraza 60 m²</text>
  <rect x="488" y="526" width="48" height="2" fill="#C5A059"/>
  <text x="488" y="560" font-size="16" font-weight="600" fill="#9A7A38">Desde 980.000 €</text>
  <text x="488" y="628" font-size="13" font-weight="600" fill="#3A4753">Ver residencia →</text>

  <!-- Card 3: Casa Pinar -->
  <g filter="url(#cardShadow)">
    <rect x="860" y="240" width="360" height="430" rx="12" fill="#FFFFFF"/>
  </g>
  <path d="M860 252 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v178 h-360 Z" fill="url(#imgPine)"/>
  <g stroke="#5E7361" stroke-width="2" fill="none" opacity="0.85">
    <path d="M908 390 L928 344 L948 390 Z"/>
    <path d="M948 390 L972 336 L996 390 Z"/>
    <line x1="888" y1="390" x2="1016" y2="390"/>
  </g>
  <circle cx="1164" cy="296" r="24" fill="#C5A059" opacity="0.75"/>
  <text x="888" y="478" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#111827">Casa Pinar</text>
  <text x="888" y="506" font-size="14" fill="#5A666E">290 m² · 3 Dormitorios · Jardín privado</text>
  <rect x="888" y="526" width="48" height="2" fill="#C5A059"/>
  <text x="888" y="560" font-size="16" font-weight="600" fill="#9A7A38">Desde 2.100.000 €</text>
  <text x="888" y="628" font-size="13" font-weight="600" fill="#3A4753">Ver residencia →</text>

  <!-- footer note -->
  <text x="640" y="726" text-anchor="middle" font-size="12" fill="#8A8F98">Precios y superficies ficticios, mostrados únicamente con fines de demostración.</text>

  <!-- synthetic caption -->
  <text x="1264" y="786" text-anchor="end" font-size="11" fill="#8A8F98">Datos sintéticos — mockup de demostración</text>
</svg>
