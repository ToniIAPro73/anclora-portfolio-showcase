<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Formulario de captación de leads con estado de validación, mockup sintético">
  <title>Formulario de contacto — Mirador Azul — mockup sintético</title>
  <defs>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="28" flood-color="#1B2A33" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="inkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15222E"/>
      <stop offset="1" stop-color="#1E3040"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="#F4F6F7"/>

  <!-- Panel -->
  <g filter="url(#panelShadow)">
    <rect x="90" y="60" width="1100" height="680" rx="16" fill="#FFFFFF"/>
  </g>

  <!-- Left editorial panel -->
  <path d="M90 76 a16 16 0 0 1 16 -16 h384 v680 h-384 a16 16 0 0 1 -16 -16 Z" fill="url(#inkGrad)"/>
  <rect x="130" y="128" width="14" height="14" transform="rotate(45 137 135)" fill="#C5A059"/>
  <text x="162" y="140" font-size="12" font-weight="600" letter-spacing="4" fill="#C5A059">CONTACTO</text>
  <text x="128" y="206" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#F4F1EA">Solicita una</text>
  <text x="128" y="248" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#F4F1EA">visita <tspan font-style="italic" fill="#C5A059">privada</tspan></text>
  <text x="130" y="296" font-size="14" fill="#B9C6CF">Nuestro equipo te acompañará en una</text>
  <text x="130" y="318" font-size="14" fill="#B9C6CF">visita personalizada por la promoción.</text>

  <rect x="130" y="352" width="48" height="2" fill="#C5A059"/>

  <text x="130" y="404" font-size="11" font-weight="600" letter-spacing="2" fill="#7E93A2">TELÉFONO</text>
  <text x="130" y="426" font-size="15" fill="#EDF2F4">+34 600 123 456</text>

  <text x="130" y="478" font-size="11" font-weight="600" letter-spacing="2" fill="#7E93A2">EMAIL</text>
  <text x="130" y="500" font-size="15" fill="#EDF2F4">hola@ejemplo.com</text>

  <text x="130" y="552" font-size="11" font-weight="600" letter-spacing="2" fill="#7E93A2">OFICINA DE VENTAS</text>
  <text x="130" y="574" font-size="15" fill="#EDF2F4">Port d'Andratx, Mallorca</text>

  <text x="130" y="690" font-size="12" font-style="italic" fill="#8FA3B1">Respondemos en menos de 24 horas.</text>

  <!-- Right form -->
  <text x="540" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#111827">Escríbenos</text>
  <text x="540" y="148" font-size="13" fill="#5A666E">Cuéntanos qué buscas y prepararemos una propuesta a medida.</text>

  <!-- Nombre -->
  <text x="540" y="192" font-size="12" font-weight="600" fill="#3A4753">Nombre</text>
  <rect x="540" y="202" width="280" height="46" rx="8" fill="#FBFCFC" stroke="#D8DEE2" stroke-width="1.5"/>
  <text x="556" y="231" font-size="14" fill="#111827">María Ejemplo</text>
  <circle cx="796" cy="225" r="9" fill="#E4F1E7"/>
  <path d="M792 225 l3 3 l6 -6" fill="none" stroke="#2F7D4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Email (error state) -->
  <text x="860" y="192" font-size="12" font-weight="600" fill="#3A4753">Email</text>
  <rect x="860" y="202" width="280" height="46" rx="8" fill="#FDF7F6" stroke="#C0392B" stroke-width="1.5"/>
  <text x="876" y="231" font-size="14" fill="#111827">nombre@ejemplo</text>
  <text x="860" y="264" font-size="11.5" fill="#C0392B">Introduce un email válido (nombre@ejemplo.com)</text>

  <!-- Teléfono -->
  <text x="540" y="308" font-size="12" font-weight="600" fill="#3A4753">Teléfono</text>
  <rect x="540" y="318" width="280" height="46" rx="8" fill="#FBFCFC" stroke="#D8DEE2" stroke-width="1.5"/>
  <text x="556" y="347" font-size="14" fill="#8A8F98">+34 600 000 000</text>

  <!-- Presupuesto (select) -->
  <text x="860" y="308" font-size="12" font-weight="600" fill="#3A4753">Presupuesto</text>
  <rect x="860" y="318" width="280" height="46" rx="8" fill="#FBFCFC" stroke="#D8DEE2" stroke-width="1.5"/>
  <text x="876" y="347" font-size="14" fill="#111827">1 M € – 2 M €</text>
  <path d="M1110 335 l8 8 l8 -8" fill="none" stroke="#7A8288" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Mensaje -->
  <text x="540" y="408" font-size="12" font-weight="600" fill="#3A4753">Mensaje</text>
  <rect x="540" y="418" width="600" height="110" rx="8" fill="#FBFCFC" stroke="#D8DEE2" stroke-width="1.5"/>
  <text x="556" y="446" font-size="14" fill="#8A8F98">Me interesa concertar una visita…</text>

  <!-- Submit -->
  <rect x="540" y="562" width="260" height="52" rx="6" fill="#C5A059"/>
  <text x="670" y="594" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF">Enviar solicitud</text>

  <text x="540" y="648" font-size="11.5" fill="#8A8F98">Al enviar aceptas la política de privacidad. Datos de ejemplo, sin envío real.</text>

  <!-- synthetic caption -->
  <text x="1264" y="786" text-anchor="end" font-size="11" fill="#8A8F98">Datos sintéticos — mockup de demostración</text>
</svg>
