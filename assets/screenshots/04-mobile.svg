<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Inter, system-ui, sans-serif" role="img" aria-label="Experiencia móvil responsive y bilingüe, dos teléfonos con hero en español y residencias en inglés, mockup sintético">
  <title>Móvil responsive ES/EN — Mirador Azul — mockup sintético</title>
  <defs>
    <filter id="phoneShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="26" flood-color="#1B2A33" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="mSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9EFF2"/>
      <stop offset="1" stop-color="#D5E2E7"/>
    </linearGradient>
    <linearGradient id="mSea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A7BEC9"/>
      <stop offset="1" stop-color="#557083"/>
    </linearGradient>
    <linearGradient id="mSand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE7D8"/>
      <stop offset="1" stop-color="#C9B68F"/>
    </linearGradient>
    <clipPath id="screenA"><rect x="237" y="52" width="351" height="696" rx="30"/></clipPath>
    <clipPath id="screenB"><rect x="692" y="52" width="351" height="696" rx="30"/></clipPath>
  </defs>

  <rect width="1280" height="800" fill="#F4F6F7"/>

  <!-- ================= Phone 1: Hero ES ================= -->
  <g filter="url(#phoneShadow)">
    <rect x="225" y="40" width="375" height="720" rx="40" fill="#101820"/>
  </g>
  <rect x="237" y="52" width="351" height="696" rx="30" fill="#F6F4F0"/>

  <g clip-path="url(#screenA)">
    <!-- status bar -->
    <text x="264" y="80" font-size="12" font-weight="600" fill="#111827">9:41</text>
    <rect x="546" y="70" width="20" height="11" rx="2.5" fill="none" stroke="#111827" stroke-width="1.2"/>
    <rect x="548.5" y="72.5" width="12" height="6" rx="1" fill="#111827"/>

    <!-- mini nav -->
    <rect x="258" y="98" width="12" height="12" transform="rotate(45 264 104)" fill="#C5A059"/>
    <text x="282" y="109" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#111827">Mirador Azul</text>
    <line x1="548" y1="98" x2="566" y2="98" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
    <line x1="548" y1="104" x2="566" y2="104" stroke="#111827" stroke-width="2" stroke-linecap="round"/>
    <line x1="548" y1="110" x2="566" y2="110" stroke="#111827" stroke-width="2" stroke-linecap="round"/>

    <!-- hero image block -->
    <rect x="237" y="128" width="351" height="118" fill="url(#mSky)"/>
    <rect x="237" y="246" width="351" height="80" fill="url(#mSea)"/>
    <circle cx="520" cy="172" r="26" fill="#C5A059" opacity="0.9"/>
    <path d="M237 274 Q 325 266 412 274 T 588 274" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>

    <!-- content -->
    <text x="262" y="362" font-size="9" font-weight="600" letter-spacing="2.5" fill="#9A7A38">MALLORCA · COSTA SUROESTE</text>
    <text x="260" y="398" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#111827">La Cúspide del</text>
    <text x="260" y="432" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#9A7A38">Mediterráneo</text>
    <text x="262" y="460" font-size="12.5" fill="#3A4753">Doce residencias privadas frente</text>
    <text x="262" y="478" font-size="12.5" fill="#3A4753">al mar en la costa suroeste.</text>

    <rect x="262" y="500" width="301" height="46" rx="4" fill="#C5A059"/>
    <text x="412" y="528" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Explorar Residencias</text>
    <rect x="262" y="558" width="301" height="46" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="1.5"/>
    <text x="412" y="586" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Solicitar información</text>

    <line x1="382" y1="644" x2="442" y2="644" stroke="#C5A059" stroke-width="2"/>
    <text x="412" y="668" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#8A8F98">DESPLÁZATE</text>
  </g>

  <!-- ================= Phone 2: Residences EN ================= -->
  <g filter="url(#phoneShadow)">
    <rect x="680" y="40" width="375" height="720" rx="40" fill="#101820"/>
  </g>
  <rect x="692" y="52" width="351" height="696" rx="30" fill="#F4F6F7"/>

  <g clip-path="url(#screenB)">
    <!-- status bar -->
    <text x="719" y="80" font-size="12" font-weight="600" fill="#111827">9:41</text>
    <rect x="1001" y="70" width="20" height="11" rx="2.5" fill="none" stroke="#111827" stroke-width="1.2"/>
    <rect x="1003.5" y="72.5" width="12" height="6" rx="1" fill="#111827"/>

    <!-- mini nav with EN toggle active -->
    <rect x="713" y="98" width="12" height="12" transform="rotate(45 719 104)" fill="#C5A059"/>
    <text x="737" y="109" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#111827">Mirador Azul</text>
    <rect x="953" y="92" width="62" height="26" rx="13" fill="#FFFFFF" stroke="#DDD6C6"/>
    <rect x="984" y="92" width="31" height="26" rx="13" fill="#C5A059"/>
    <text x="968" y="109" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7A8288">ES</text>
    <text x="999" y="109" text-anchor="middle" font-size="10.5" font-weight="600" fill="#FFFFFF">EN</text>

    <!-- header -->
    <text x="717" y="154" font-size="9" font-weight="600" letter-spacing="2.5" fill="#9A7A38">RESIDENCES</text>
    <text x="715" y="186" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#111827">Sea-view Residences</text>

    <!-- card 1 -->
    <rect x="717" y="206" width="301" height="192" rx="10" fill="#FFFFFF"/>
    <path d="M717 216 a10 10 0 0 1 10 -10 h281 a10 10 0 0 1 10 10 v74 h-301 Z" fill="url(#mSea)"/>
    <circle cx="980" cy="236" r="14" fill="#C5A059" opacity="0.85"/>
    <text x="733" y="322" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#111827">Villa Almadrava</text>
    <text x="733" y="342" font-size="11" fill="#5A666E">380 m² · 4 Bedrooms</text>
    <text x="733" y="368" font-size="12.5" font-weight="600" fill="#9A7A38">From €1,450,000</text>

    <!-- card 2 -->
    <rect x="717" y="414" width="301" height="192" rx="10" fill="#FFFFFF"/>
    <path d="M717 424 a10 10 0 0 1 10 -10 h281 a10 10 0 0 1 10 10 v74 h-301 Z" fill="url(#mSand)"/>
    <circle cx="764" cy="444" r="13" fill="#C5A059" opacity="0.7"/>
    <text x="733" y="530" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#111827">Ático Levante</text>
    <text x="733" y="550" font-size="11" fill="#5A666E">145 m² · 2 Bedrooms</text>
    <text x="733" y="576" font-size="12.5" font-weight="600" fill="#9A7A38">From €980,000</text>

    <!-- card 3 (scroll peek) -->
    <rect x="717" y="622" width="301" height="192" rx="10" fill="#FFFFFF"/>
    <path d="M717 632 a10 10 0 0 1 10 -10 h281 a10 10 0 0 1 10 10 v74 h-301 Z" fill="url(#mSea)"/>
    <text x="733" y="738" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#111827">Casa Pinar</text>
  </g>

  <!-- phone labels -->
  <text x="412" y="788" text-anchor="middle" font-size="12" fill="#5A666E">Hero — ES</text>
  <text x="867" y="788" text-anchor="middle" font-size="12" fill="#5A666E">Residencias — EN</text>

  <!-- synthetic caption -->
  <text x="1264" y="788" text-anchor="end" font-size="11" fill="#8A8F98">Datos sintéticos — mockup de demostración</text>
</svg>
